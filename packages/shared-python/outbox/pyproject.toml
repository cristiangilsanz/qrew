[project]
name = "outbox"
version = "0.1.0"
description = "Transactional outbox sweeper protocol and helper"
requires-python = ">=3.12"
dependencies = [
    "db",
    "jobs",
    "observability",
]

[tool.uv]
venvPath = "../../.."
venv = ".venv"

[tool.uv.sources]
db = { workspace = true }
jobs = { workspace = true }
observability = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../db/src", "../jobs/src", "../observability/src"]
python_files = ["*_test.py"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
reportMissingTypeStubs = false
