components:
  schemas:
    DocumentType:
      type: string
      enum:
      - dni
      - nie
      - other
      title: DocumentType
    ErrorDetail:
      properties:
        message:
          type: string
          title: Message
          description: Human-readable explanation of the failure.
        field:
          anyOf:
          - type: string
          - type: 'null'
          title: Field
      type: object
      required:
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        detail:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - detail
      title: ErrorResponse
    HolderInput:
      properties:
        position:
          type: integer
          minimum: 1.0
          title: Position
        holder_name:
          type: string
          maxLength: 255
          minLength: 1
          title: Holder Name
        holder_document_type:
          $ref: '#/components/schemas/DocumentType'
          default: dni
        holder_dni:
          type: string
          maxLength: 50
          minLength: 1
          title: Holder Dni
      type: object
      required:
      - position
      - holder_name
      - holder_dni
      title: HolderInput
    HolderResponse:
      properties:
        position:
          type: integer
          title: Position
        holder_name:
          type: string
          title: Holder Name
        holder_document_type:
          $ref: '#/components/schemas/DocumentType'
        holder_dni:
          type: string
          title: Holder Dni
      type: object
      required:
      - position
      - holder_name
      - holder_document_type
      - holder_dni
      title: HolderResponse
    MarketAssignmentResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        listing_id:
          type: string
          format: uuid
          title: Listing Id
        event_id:
          type: string
          format: uuid
          title: Event Id
        ticket_type_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ticket Type Id
        price_cents:
          type: integer
          title: Price Cents
        currency:
          type: string
          title: Currency
        state:
          type: string
          title: State
        assigned_at:
          type: string
          format: date-time
          title: Assigned At
        expires_at:
          type: string
          format: date-time
          title: Expires At
        holder_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Holder Name
        holder_document_type:
          anyOf:
          - $ref: '#/components/schemas/DocumentType'
          - type: 'null'
        holder_dni:
          anyOf:
          - type: string
          - type: 'null'
          title: Holder Dni
        event_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Name
        ticket_type_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticket Type Name
      type: object
      required:
      - id
      - listing_id
      - event_id
      - price_cents
      - currency
      - state
      - assigned_at
      - expires_at
      title: MarketAssignmentResponse
    MarketListingResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        ticket_id:
          type: string
          format: uuid
          title: Ticket Id
        event_id:
          type: string
          format: uuid
          title: Event Id
        ticket_type_id:
          type: string
          format: uuid
          title: Ticket Type Id
        price_cents:
          type: integer
          title: Price Cents
        currency:
          type: string
          title: Currency
        state:
          type: string
          title: State
        listed_at:
          type: string
          format: date-time
          title: Listed At
        expires_at:
          type: string
          format: date-time
          title: Expires At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        cancelled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cancelled At
      type: object
      required:
      - id
      - ticket_id
      - event_id
      - ticket_type_id
      - price_cents
      - currency
      - state
      - listed_at
      - expires_at
      title: MarketListingResponse
    MarketQueueEntryResponse:
      properties:
        event_id:
          type: string
          format: uuid
          title: Event Id
        joined_at:
          type: string
          format: date-time
          title: Joined At
      type: object
      required:
      - event_id
      - joined_at
      title: MarketQueueEntryResponse
    MarketQueueJoinResponse:
      properties:
        in_queue:
          type: boolean
          title: In Queue
        joined_at:
          type: string
          format: date-time
          title: Joined At
      type: object
      required:
      - in_queue
      - joined_at
      title: MarketQueueJoinResponse
    MarketQueueStatusResponse:
      properties:
        in_queue:
          type: boolean
          title: In Queue
        joined_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Joined At
        pending_assignment_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Pending Assignment Id
        queue_count:
          type: integer
          title: Queue Count
          default: 0
      type: object
      required:
      - in_queue
      title: MarketQueueStatusResponse
    MarketSetHoldersRequest:
      properties:
        holder_name:
          type: string
          maxLength: 255
          minLength: 1
          title: Holder Name
        holder_document_type:
          $ref: '#/components/schemas/DocumentType'
          default: dni
        holder_dni:
          type: string
          maxLength: 50
          minLength: 1
          title: Holder Dni
      type: object
      required:
      - holder_name
      - holder_dni
      title: MarketSetHoldersRequest
    QueueJoinResponse:
      properties:
        position:
          type: integer
          title: Position
      type: object
      required:
      - position
      title: QueueJoinResponse
    QueuePositionResponse:
      properties:
        position:
          anyOf:
          - type: integer
          - type: 'null'
          title: Position
        redeem_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Redeem Token
      type: object
      required:
      - position
      title: QueuePositionResponse
    QueueRedeemRequest:
      properties:
        redeem_window_token:
          type: string
          minLength: 1
          title: Redeem Window Token
      type: object
      required:
      - redeem_window_token
      title: QueueRedeemRequest
    QueueRedeemResponse:
      properties:
        reservation_window_token:
          type: string
          title: Reservation Window Token
      type: object
      required:
      - reservation_window_token
      title: QueueRedeemResponse
    ReservationCreateRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ReservationItemInput'
          type: array
          maxItems: 10
          minItems: 1
          title: Items
        reservation_window_token:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Reservation Window Token
      type: object
      required:
      - items
      title: ReservationCreateRequest
    ReservationItemInput:
      properties:
        ticket_type_id:
          type: string
          format: uuid
          title: Ticket Type Id
        quantity:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Quantity
      type: object
      required:
      - ticket_type_id
      - quantity
      title: ReservationItemInput
    ReservationItemResponse:
      properties:
        ticket_type_id:
          type: string
          format: uuid
          title: Ticket Type Id
        quantity:
          type: integer
          title: Quantity
      type: object
      required:
      - ticket_type_id
      - quantity
      title: ReservationItemResponse
    ReservationResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        event_id:
          type: string
          format: uuid
          title: Event Id
        items:
          items:
            $ref: '#/components/schemas/ReservationItemResponse'
          type: array
          title: Items
        quantity:
          type: integer
          title: Quantity
        status:
          $ref: '#/components/schemas/ReservationStatus'
        expires_at:
          type: string
          format: date-time
          title: Expires At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - event_id
      - items
      - quantity
      - status
      - expires_at
      - created_at
      title: ReservationResponse
    ReservationStatus:
      type: string
      enum:
      - reserved
      - paid
      - cancelled
      - expired
      title: ReservationStatus
    SetHoldersRequest:
      properties:
        holders:
          items:
            $ref: '#/components/schemas/HolderInput'
          type: array
          title: Holders
      type: object
      required:
      - holders
      title: SetHoldersRequest
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
